name: Déploiement GitHub Pages

on:
  push:
    branches: [main, claude/trading-learning-tool]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # On ne publie que les fichiers de l'application (pas le brief, le README, etc.)
      - name: Prépare le site
        run: |
          mkdir _site
          cp index.html app.js app.css data.js jeu.js jeu-data.js main.js tokens.css jeu-tokens.css accueil-tokens.css sw.js manifest.webmanifest _site/
          cp -r fonts icons assets _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
